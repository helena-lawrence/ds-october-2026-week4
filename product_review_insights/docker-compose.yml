services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8001}:8001"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8001
      API_URL: http://backend:8001
    ports:
      - "${FRONTEND_PORT:-8502}:8501"
    depends_on:
      - backend
